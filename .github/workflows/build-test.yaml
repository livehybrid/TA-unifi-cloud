name: Splunk App CI/CD
on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  workflow_dispatch: {}
  schedule:
    # Weekly run: unit, mock integration and both live jobs, so main's health
    # (and the real APIs' shape) is always current.
    - cron: "47 6 * * 1"
permissions:
  pull-requests: write
  actions: write
  checks: write
  contents: write
# Cancel a superseded run on the same branch or pull request, so CI never
# spends time on code that has already been replaced. The default branch is
# never cancelled: every push there gets its own complete run, because a
# cancelled run on a branch that deploys or releases can let commits go out
# unchecked (haloclock-app, 13 Oct 2026).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  package:
    # Skipped on the weekly schedule (tests only); its dependents skip too.
    if: github.event_name != 'schedule'
    # ubuntu-24.04 because ubuntu-latest (26.04) has no Python 3.9, which the
    # add-on build and Splunk 10.1-and-earlier parity need.
    runs-on: ubuntu-24.04
    steps:
      - name: Package app
        uses: livehybrid/deploy-splunk-app-action@main
        with:
          python-version: "3.9"

  unit-test:
    # The collector (package/bin/unifi_client.py) against the synthetic mock in
    # tests/mock: pagination, unsupported endpoints, an offline console, auth
    # failure, TLS verification on and off. No Splunk, no network, no secrets.
    # 3.9 because Splunk 10.1 and earlier run the add-on on it.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest "requests>=2.32.5,<2.33.0"
      - run: pytest tests/unit -v -ra -p no:cacheprovider

  integration-test:
    name: integration-test (splunk-docker)
    # Real Splunk in Docker against the synthetic mock (docker-compose `mock`
    # service): Cloud and Local accounts, every resource, exact event counts.
    # No secrets, so it runs on every push. Dependabot actors still skip it
    # (estate policy: their PRs need build + AppInspect only).
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 10.0 is the oldest Splunk this add-on is tested on (Python 3.9);
        # 10.6.0 is current (Python 3.13).
        splunk: ["10.0", "10.6.0"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install UCC framework + pytest
        run: pip install --upgrade splunk-add-on-ucc-framework pytest

      - name: Build add-on into stage/
        shell: bash
        run: make -C docker build

      - name: Start Splunk and the mock (wait for health)
        working-directory: docker
        env:
          SPLUNK_IMAGE_TAG: ${{ matrix.splunk }}
        run: docker compose up -d --wait --wait-timeout 360

      - name: Run integration suite
        env:
          SPLUNK_MGMT_URL: https://127.0.0.1:8089
          SPLUNK_USER: admin
          SPLUNK_PASSWORD: Changeme1!
          SPLUNK_CONTAINER: ta_unifi_cloud_splunk
        run: pytest tests/ --ignore=tests/live --ignore=tests/unit -v -ra -p no:cacheprovider

      - name: Splunk logs on failure
        # Mock data only: synthetic, safe to print.
        if: failure()
        working-directory: docker
        run: |
          docker compose logs --tail 300 splunk || true
          docker exec ta_unifi_cloud_splunk sh -c 'tail -n 200 /opt/splunk/var/log/splunk/splunkd.log; tail -n 200 /opt/splunk/var/log/splunk/ta-unifi-cloud_*.log' || true

      - name: Tear down
        if: always()
        working-directory: docker
        run: docker compose down -v || true

  live-cloud:
    # Real api.ui.com through the add-on in real Splunk (Cloud account, every
    # console via the connector). Only on main pushes, the weekly schedule and
    # manual runs; never for pull requests or other branches. Not a release
    # gate. William's network data is private: the test asserts and prints
    # counts and field names only, runs with --tb=no, and no log is dumped.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install --upgrade splunk-add-on-ucc-framework pytest
      - run: make -C docker build
      - name: Start Splunk
        working-directory: docker
        env:
          SPLUNK_IMAGE_TAG: "10.6.0"
        run: docker compose up -d --wait --wait-timeout 360
      - name: Live cloud end to end (counts only)
        env:
          UNIFI_API_KEY: ${{ secrets.UNIFI_CLOUD_API_KEY }}
          LIVE_SUMMARY: ${{ runner.temp }}/live-cloud-summary.json
          SPLUNK_MGMT_URL: https://127.0.0.1:8089
          SPLUNK_PASSWORD: Changeme1!
          SPLUNK_CONTAINER: ta_unifi_cloud_splunk
        run: |
          if [ -z "$UNIFI_API_KEY" ]; then echo "UNIFI_CLOUD_API_KEY secret missing" >&2; exit 1; fi
          pytest tests/live/test_live_cloud.py -v --tb=no -rN -p no:cacheprovider -p no:warnings
      - name: Summary (counts and field names only)
        if: always()
        run: cat "${{ runner.temp }}/live-cloud-summary.json" 2>/dev/null || echo "no summary written"
      - name: Tear down
        if: always()
        working-directory: docker
        run: docker compose down -v >/dev/null 2>&1 || true

  live-local:
    # The add-on's collector against William's own console from a self-hosted
    # runner on his LAN (label unifi-local), without Splunk: the full
    # Splunk path is proven by integration-test (mock) and live-cloud. Same
    # event rules as live-cloud: never pull requests, never other branches.
    # live_local.py prints counts and field names only, never a traceback.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: [self-hosted, unifi-local]
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Live local collector check (counts only)
        env:
          UNIFI_LOCAL_URL: ${{ secrets.UNIFI_LOCAL_URL }}
          UNIFI_LOCAL_API_KEY: ${{ secrets.UNIFI_LOCAL_API_KEY }}
          UNIFI_LOCAL_VERIFY: "0"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 tests/live/live_local.py

  appinspect:
    name: quality-appinspect
    needs: package
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/appinspect-cli.yml@main
    with:
      tags: "cloud,future,private_victoria"
    secrets:
      token: "${{ secrets.GITHUB_TOKEN }}"

  quality-appinspect-api:
    name: quality-appinspect-api
    needs:
      - appinspect
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/appinspect-api.yml@main
    secrets:
      splunkbase_username: ${{ secrets.SPLUNKBASE_USERNAME }}
      splunkbase_password: ${{ secrets.SPLUNKBASE_PASSWORD }}

  publish-gh:
    permissions:
      contents: write
    needs:
      - appinspect
      - integration-test
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/publish.yml@main

  publish-splunkbase:
    # Tag runs only: needs the GitHub release (every CLI gate + integration
    # tests) and Splunk's hosted AppInspect. Uploads stay off unless the repo
    # variable SPLUNKBASE_PUBLISH_ENABLED=true. Versions claimed: 10.0 and 10.6
    # are tested in CI, the releases between share their runtimes.
    needs:
      - publish-gh
      - quality-appinspect-api
    permissions:
      contents: read
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/publish-splunkbase.yml@main
    with:
      app_id: "7494"
      splunk_versions: "10.6,10.5,10.4,10.3,10.2,10.1,10.0"
    secrets:
      splunkbase_username: ${{ secrets.SPLUNKBASE_USERNAME }}
      splunkbase_password: ${{ secrets.SPLUNKBASE_PASSWORD }}
