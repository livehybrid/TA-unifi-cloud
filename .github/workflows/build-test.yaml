name: Splunk App CI/CD
on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  workflow_dispatch: {}
  schedule:
    # Weekly real-API canary — the integration suite runs with the real
    # UniFi key on this cadence without burning minutes on every push.
    - cron: "47 6 * * 1"
permissions:
  pull-requests: write
  actions: write
  checks: write
  contents: write
jobs:
  package:
    # On the weekly schedule only the integration suite (with the real key)
    # runs; skipping package makes its other dependents skip too.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Package app
        uses: livehybrid/deploy-splunk-app-action@main
        with:
          python-version: "3.9"

  integration-test:
    name: integration-test (splunk-docker)
    # No needs: on the weekly schedule this is the only job (it builds the
    # add-on itself); on pushes it runs alongside package as before.
    # Dependabot actors get no egress/secrets, so the live Splunk E2E can only
    # fail for them. CLI AppInspect still covers Dependabot PRs.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install UCC framework + pytest
        run: pip install --upgrade splunk-add-on-ucc-framework pytest

      - name: Build add-on into stage/
        shell: bash
        run: |
          ucc-gen build --source package --ta-version 1.1.0
          rm -rf stage && mkdir -p stage
          cp -r output/TA-unifi-cloud stage/TA-unifi-cloud
          # The test container's splunk user (a different uid) must read the app
          # and write local/inputs.conf + checkpoints into the bind mount. Wide
          # perms are fine on this throwaway copy — it is never the artefact.
          chmod -R 777 stage/TA-unifi-cloud

      - name: Start Splunk (wait for health)
        working-directory: docker
        run: docker compose up -d --wait --wait-timeout 360

      - name: Load UNIFI_API_KEY from 1Password
        # Real-key runs are limited to the weekly schedule, manual dispatch,
        # main pushes and tags — branch pushes stay keyless (the live test
        # skips) so every push doesn't hit the real UniFi API.
        if: >-
          ${{ github.event_name == 'schedule' ||
              github.event_name == 'workflow_dispatch' ||
              github.ref == 'refs/heads/main' ||
              startsWith(github.ref, 'refs/tags/') }}
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        shell: bash
        run: |
          if [ -z "$OP_SERVICE_ACCOUNT_TOKEN" ]; then
            echo "OP_SERVICE_ACCOUNT_TOKEN unavailable — live test will skip." >&2
            exit 0
          fi
          curl -sSfL https://cache.agilebits.com/dist/1P/op2/pkg/v2.30.0/op_linux_amd64_v2.30.0.zip -o /tmp/op.zip
          (cd /tmp && unzip -oq op.zip op && sudo mv op /usr/local/bin/op)
          KEY=""
          # The item title has been referred to as several spellings — try them.
          for item in unify unifi UniFi my.unifi; do
            KEY=$(op read "op://cicd/$item/password" 2>/dev/null) && [ -n "$KEY" ] && break
          done
          if [ -z "$KEY" ]; then
            echo "no matching UniFi item found in the cicd vault (tried unify/unifi/UniFi/my.unifi) — live test will skip." >&2
            exit 0
          fi
          # op-loaded values are NOT auto-masked — mask before exporting.
          echo "::add-mask::$KEY"
          echo "UNIFI_API_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Run integration suite
        env:
          SPLUNK_MGMT_URL: https://127.0.0.1:8089
          SPLUNK_USER: admin
          SPLUNK_PASSWORD: Changeme1!
          SPLUNK_CONTAINER: ta_unifi_cloud_splunk
        run: pytest tests/ -v -ra

      - name: Splunk logs on failure
        if: failure()
        working-directory: docker
        run: |
          docker compose logs --tail 300 splunk || true
          docker exec ta_unifi_cloud_splunk tail -n 300 /opt/splunk/var/log/splunk/splunkd.log || true

      - name: Tear down
        if: always()
        working-directory: docker
        run: docker compose down -v || true

  appinspect:
    name: quality-appinspect
    needs: package
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/appinspect-cli.yml@main
    with:
      tags: "cloud,future,private_victoria"
    secrets:
      token: "${{ secrets.GITHUB_TOKEN }}"

  quality-appinspect-api:
    name: quality-appinspect-api
    needs:
      - appinspect
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/appinspect-api.yml@main
    secrets:
      splunkbase_username: ${{ secrets.SPLUNKBASE_USERNAME }}
      splunkbase_password: ${{ secrets.SPLUNKBASE_PASSWORD }}

  publish-gh:
    permissions:
      contents: write
    needs:
      - appinspect
      - integration-test
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/publish.yml@main
