# Python runtime pin for the Splunk 10.2+ dual runtime. python.version is the
# legacy fallback for Splunk 10.1 and lower; python.required pins 10.2+ to 3.9
# only (a comma list would let 10.2+ select the highest, i.e. 3.13, defeating
# the pin the py3.9-capped vendored libs need). ucc-gen merges these stanzas
# over its generated inputs.conf.

[unifi_collect_hosts]
python.version = python3
python.required = 3.9

[unifi_collect_sites]
python.version = python3
python.required = 3.9

[unifi_collect_devices]
python.version = python3
python.required = 3.9
